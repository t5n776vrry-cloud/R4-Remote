              // ------------------------------------------------------------------ HTTP

              private void serve() {
                  try {
                      server = new ServerSocket();
                      server.setReuseAddress(true);
                      server.bind(new InetSocketAddress(Util.PORT));
                      while (!server.isClosed()) {
                          Socket s = server.accept();
                          pool.execute(() -> handle(s));
                      }
                  } catch (IOException ignored) {
                      // ปิดเซิร์ฟเวอร์แล้ว
                  }
              }

              private void handle(Socket socket) {
                  try (Socket s = socket) {
                      s.setSoTimeout(5000);
                      BufferedReader in = new BufferedReader(
                              new InputStreamReader(s.getInputStream(), StandardCharsets.UTF_8));
                      String requestLine = in.readLine();
                      if (requestLine == null) return;
                      String[] parts = requestLine.split(" ");
                      if (parts.length < 2) return;
                      String header;
                      while ((header = in.readLine()) != null && !header.isEmpty()) {
                          // ไม่ต้องใช้ header
                      }

                      String method = parts[0];
                      Uri uri = Uri.parse("http://r4" + parts[1]);
                      String path = uri.getPath() == null ? "/" : uri.getPath();
                      String k = uri.getQueryParameter("k");
                      OutputStream out = s.getOutputStream();

                      // ไอคอนแอปไม่ใช่ข้อมูลลับ ให้ iPhone โหลดได้โดยไม่ต้องมีรหัส
                      if ("GET".equals(method) && "/icon-180.png".equals(path)) {
                          send(out, 200, "image/png", icon180);
                          return;
                      }
                      if ("GET".equals(method) && "/icon-512.png".equals(path)) {
                          send(out, 200, "image/png", icon512);
                          return;
                      }

                      if (k == null || !MessageDigest.isEqual(
                              k.getBytes(StandardCharsets.UTF_8), token.getBytes(StandardCharsets.UTF_8))) {
                          send(out, 403, "text/html; charset=utf-8",
                                  "<h2>ลิงก์ไม่ถูกต้อง — สแกน QR บนเครื่อง R4 ใหม่</h2>".getBytes(StandardCharsets.UTF_8));
                          return;
                      }

                      if ("GET".equals(method) && "/manifest.webmanifest".equals(path)) {
                          send(out, 200, "application/manifest+json; charset=utf-8", manifest);
                      } else if ("GET".equals(method) && "/".equals(path)) {
                          send(out, 200, "text/html; charset=utf-8", page);
                      } else if ("GET".equals(method) && "/api/status".equals(path)) {
                          sendJson(out, status());
                      } else if ("GET".equals(method) && "/api/apps".equals(path)) {
                          sendJson(out, apps());
                      } else if ("GET".equals(method) && "/api/art".equals(path)) {
                          byte[] art = albumArt();
                          if (art == null) send(out, 404, "text/plain", new byte[0]);
                          else send(out, 200, "image/jpeg", art);
                      } else if ("GET".equals(method) && "/api/icon".equals(path)) {
                          byte[] icon = icon(uri.getQueryParameter("pkg"));
                          if (icon == null) send(out, 404, "text/plain", new byte[0]);
                          else send(out, 200, "image/png", icon);
                      } else if ("POST".equals(method) && "/api/select".equals(path)) {
                          if (select(uri.getQueryParameter("pkg"))) sendJson(out, status());
                          else send(out, 404, "application/json", "{}".getBytes(StandardCharsets.UTF_8));
                      } else if ("GET".equals(method) && "/api/queue".equals(path)) {
                          sendJson(out, queue());
                      } else if ("GET".equals(method) && "/api/browse".equals(path)) {
                          sendJson(out, browse(uri.getQueryParameter("id")));
                      } else if ("GET".equals(method) && "/api/search".equals(path)) {
                          sendJson(out, search(uri.getQueryParameter("q")));
                      } else if ("GET".equals(method) && "/api/img".equals(path)) {
                          byte[] img = lib.image(uri.getQueryParameter("i"));
                          if (img == null) send(out, 404, "text/plain", new byte[0]);
                          else send(out, 200, "image/jpeg", img);
                      } else if ("POST".equals(method) && "/api/queue/play".equals(path)) {
                          if (playQueueItem(uri.getQueryParameter("id"))) sendJson(out, status());
                          else send(out, 404, "application/json", "{}".getBytes(StandardCharsets.UTF_8));
                      } else if ("POST".equals(method) && "/api/browse/play".equals(path)) {
                          if (playMediaId(uri.getQueryParameter("id"))) sendJson(out, status());
                          else send(out, 404, "application/json", "{}".getBytes(StandardCharsets.UTF_8));
                      } else if ("POST".equals(method) && "/api/searchplay".equals(path)) {
                          if (playSearch(uri.getQueryParameter("q"))) sendJson(out, status());
                          else send(out, 404, "application/json", "{}".getBytes(StandardCharsets.UTF_8));
                      } else if ("POST".equals(method) && path.startsWith("/api/")) {
                          if (doAction(path.substring(5))) sendJson(out, status());
                          else send(out, 404, "application/json", "{}".getBytes(StandardCharsets.UTF_8));
                      } else {
