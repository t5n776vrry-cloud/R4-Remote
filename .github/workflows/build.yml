                      }
                  } catch (Exception ignored) {
                  }
              }

              private static void send(OutputStream out, int code, String type, byte[] body) throws IOException {
                  String reason = code == 200 ? "OK" : code == 403 ? "Forbidden" : "Not Found";
                  String head = "HTTP/1.1 " + code + " " + reason + "\r\n"
                          + "Content-Type: " + type + "\r\n"
                          + "Content-Length: " + body.length + "\r\n"
                          + "Cache-Control: no-store\r\n"
                          + "Connection: close\r\n\r\n";
                  out.write(head.getBytes(StandardCharsets.US_ASCII));
                  out.write(body);
                  out.flush();
              }

              private static void sendJson(OutputStream out, String json) throws IOException {
                  send(out, 200, "application/json; charset=utf-8", json.getBytes(StandardCharsets.UTF_8));
              }

              // ------------------------------------------------------------------ Media sessions

              private List<MediaController> sessions() {
                  try {
                      MediaSessionManager m = getSystemService(MediaSessionManager.class);
                      List<MediaController> list =
                              m.getActiveSessions(new ComponentName(this, MediaListener.class));
                      mediaAccess = true;
                      return list == null ? new ArrayList<>() : list;
                  } catch (SecurityException e) {
                      mediaAccess = false;
                      return new ArrayList<>();
                  }
              }

              private static boolean isPlaying(MediaController c) {
                  PlaybackState st = c.getPlaybackState();
                  return st != null && st.getState() == PlaybackState.STATE_PLAYING;
              }

              /**
               * แอปที่ควบคุมอยู่: แอปที่เลือกจาก iPhone
               * แต่ถ้ามีแอปอื่นกำลังเล่น (เช่น กดเล่นบน R4 เอง) จะตามแอปนั้นไป
               */
              private MediaController controller() {
                  List<MediaController> list = sessions();
                  MediaController playing = null, selected = null;
                  for (MediaController c : list) {
                      if (playing == null && isPlaying(c)) playing = c;
                      if (selected == null && c.getPackageName().equals(selectedPkg)) selected = c;
                  }
                  if (selected != null && (isPlaying(selected) || playing == null)) return selected;
                  if (playing != null) {
                      selectedPkg = playing.getPackageName();
                      return playing;
                  }
                  if (selectedPkg != null) return null; // แอปที่เลือกยังไม่เริ่มเล่น
                  return list.isEmpty() ? null : list.get(0);
              }

              /** แอปเพลงที่ติดตั้งอยู่และสั่งเล่นจากภายนอกได้ (pkg → ชื่อคลาส MediaBrowserService) */
              private Map<String, String> browserServices() {
                  Map<String, String> m = new HashMap<>();
                  List<ResolveInfo> list = getPackageManager().queryIntentServices(
                          new Intent("android.media.browse.MediaBrowserService"), 0);
                  for (ResolveInfo ri : list) {
                      if (ri.serviceInfo == null || getPackageName().equals(ri.serviceInfo.packageName)) continue;
                      m.putIfAbsent(ri.serviceInfo.packageName, ri.serviceInfo.name);
                  }
                  return m;
              }

              private String apps() {
                  JSONArray arr = new JSONArray();
                  try {
                      MediaController cur = controller();
                      String curPkg = cur != null ? cur.getPackageName() : selectedPkg;
                      Set<String> seen = new HashSet<>();
                      for (MediaController c : sessions()) {
                          String p = c.getPackageName();
                          if (!seen.add(p)) continue;
                          arr.put(appJson(p, isPlaying(c) ? "playing" : "paused", title(c), p.equals(curPkg)));
                      }
                      List<String> rest = new ArrayList<>();
                      for (String p : browserServices().keySet()) if (!seen.contains(p)) rest.add(p);
                      rest.sort(Comparator.comparing(this::appLabel, String.CASE_INSENSITIVE_ORDER));
                      for (String p : rest) arr.put(appJson(p, "", "", p.equals(curPkg)));
                  } catch (JSONException ignored) {
                  }
                  return arr.toString();
              }

              private JSONObject appJson(String pkg, String state, String title, boolean selected) throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("pkg", pkg);
                  o.put("label", appLabel(pkg));
                  o.put("state", state);
                  o.put("title", title);
                  o.put("selected", selected);
                  return o;
              }

              /** สลับไปเล่นแอปที่เลือก: หยุดแอปอื่น แล้วสั่งแอปที่เลือกให้เล่น */
              private boolean select(String pkg) {
                  if (pkg == null) return false;
                  List<MediaController> list = sessions();
                  MediaController target = null;
                  for (MediaController c : list) if (c.getPackageName().equals(pkg)) target = c;
                  Map<String, String> services = browserServices();
                  if (target == null && !services.containsKey(pkg)) return false;

                  pauseOthers(pkg);
                  selectedPkg = pkg;
                  if (target != null) target.getTransportControls().play();
                  else startApp(pkg, services.get(pkg));
                  SystemClock.sleep(target != null ? 500 : 1200);
                  return true;
              }

              private void pauseOthers(String pkg) {
                  for (MediaController c : sessions()) {
                      if (!c.getPackageName().equals(pkg) && isPlaying(c)) c.getTransportControls().pause();
                  }
              }

              /** เริ่มเล่นแอปที่ยังไม่ได้เปิด ผ่าน MediaBrowser (แบบเดียวกับ Android Auto) */
              private void startApp(String pkg, String serviceClass) {
                  MediaBrowser b = lib.browser(pkg, serviceClass);
                  try {
                      if (b != null) {
                          lib.controllerFor(b).getTransportControls().play();
                          return;
                      }
                  } catch (Exception ignored) {
                  }
                  sendMediaButton(pkg);
              }

              // ------------------------------------------------------------------ เลือกเพลง

              /** แอปที่หน้ารีโมทกำลังควบคุม */
              private String currentPkg() {
                  MediaController c = controller();
                  return c != null ? c.getPackageName() : selectedPkg;
              }

              /** ตัวควบคุมของแอป: ใช้ session ที่เปิดอยู่ ถ้าไม่มีให้ต่อผ่านคลังเพลง */
              private MediaController controllerForPkg(String pkg) {
                  for (MediaController c : sessions()) if (c.getPackageName().equals(pkg)) return c;
                  MediaBrowser b = lib.browser(pkg, browserServices().get(pkg));
                  return b == null ? null : lib.controllerFor(b);
              }

              private static String error(String msg) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("ok", false);
                      o.put("msg", msg);
                      o.put("items", new JSONArray());
                  } catch (JSONException ignored) {
                  }
                  return o.toString();
              }

              private String queue() {
                  MediaController c = controller();
                  if (c == null) return error("ยังไม่มีเพลงกำลังเล่น");
                  try {
                      JSONObject o = lib.queueJson(c);
                      o.put("ok", true);
                      if (o.getJSONArray("items").length() == 0) {
                          o.put("msg", "แอปนี้ไม่ได้ส่งคิวเพลงออกมา ลองใช้แท็บคลังเพลงหรือค้นหา");
                      }
                      return o.toString();
                  } catch (Exception e) {
                      return error("อ่านคิวเพลงไม่ได้");
                  }
              }

              private String browse(String parentId) {
                  String pkg = currentPkg();
                  if (pkg == null) return error("เลือกแอปก่อน (แตะชื่อแอปบนหน้ารีโมท)");
                  MediaBrowser b = lib.browser(pkg, browserServices().get(pkg));
                  if (b == null) return error(appLabel(pkg) + " ไม่อนุญาตให้แอปอื่นเปิดคลังเพลง ลองใช้แท็บค้นหาหรือคิวแทน");
                  List<MediaBrowser.MediaItem> items = lib.children(b, parentId);
                  if (items == null) return error(appLabel(pkg) + " ไม่ส่งรายการเพลงมา ลองใช้แท็บค้นหาหรือคิวแทน");
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", true);
                      o.put("app", appLabel(pkg));
                      o.put("items", lib.itemsJson(items));
                      if (items.isEmpty()) o.put("msg", "ไม่มีรายการในหน้านี้");
                      return o.toString();
                  } catch (JSONException e) {
                      return error("อ่านรายการไม่ได้");
                  }
              }

              private String search(String q) {
                  String pkg = currentPkg();
                  if (pkg == null) return error("เลือกแอปก่อน (แตะชื่อแอปบนหน้ารีโมท)");
                  if (q == null || q.trim().isEmpty()) return error("พิมพ์ชื่อเพลงหรือศิลปิน");
                  if (YouTubeMusic.PKG.equals(pkg)) return youTubeSearch(q.trim());
                  List<android.support.v4.media.MediaBrowserCompat.MediaItem> items =
                          searcher.search(pkg, browserServices().get(pkg), q.trim());
                  if (items == null) {
                      return error(appLabel(pkg) + " ไม่ส่งรายการผลค้นหามา แตะ “เล่นผลลัพธ์แรกเลย” ด้านบนแทนได้");
                  }
                  try {
                      JSONObject o = new JSONObject();
                      o.put("ok", true);
                      o.put("items", searcher.itemsJson(lib, items));
                      if (items.isEmpty()) o.put("msg", "ไม่พบเพลงที่ค้นหา");
                      return o.toString();
                  } catch (JSONException e) {
                      return error("อ่านผลค้นหาไม่ได้");
                  }
              }

              /** YouTube Music ไม่ส่งผลค้นหาให้แอปอื่น จึงค้นจากเว็บ YouTube Music แทน */
              private String youTubeSearch(String q) {
                  if (!YouTubeMusic.canOpenFromBackground(this)) {
                      return error("บน R4 เปิดแอปรีโมทเพลง แล้วกด “อนุญาตแสดงทับแอปอื่น” ก่อน จึงจะเปิดเพลงจากผลค้นหาได้");
                  }
                  try {
                      JSONObject o = new JSONObject();
                      JSONArray items = YouTubeMusic.search(q);
                      o.put("ok", true);
                      o.put("items", items);
                      if (items.length() == 0) o.put("msg", "ไม่พบเพลงที่ค้นหา");
                      return o.toString();
                  } catch (Exception e) {
                      return error("ค้นหาใน YouTube Music ไม่ได้ (" + e.getMessage() + ") ลอง “เล่นผลลัพธ์แรกเลย” แทน");
                  }
              }

              private boolean playQueueItem(String id) {
                  MediaController c = controller();
                  if (c == null || id == null) return false;
                  try {
                      c.getTransportControls().skipToQueueItem(Long.parseLong(id));
                  } catch (NumberFormatException e) {
                      return false;
                  }
                  SystemClock.sleep(500);
                  return true;
              }

              private boolean playMediaId(String id) {
                  if (id != null && id.startsWith(YouTubeMusic.ID_PREFIX)) {
                      if (!YouTubeMusic.play(this, id.substring(YouTubeMusic.ID_PREFIX.length()))) return false;
                      pauseOthers(YouTubeMusic.PKG);
                      selectedPkg = YouTubeMusic.PKG;
                      SystemClock.sleep(2500); // รอแอปเปิดและเริ่มเล่น
                      return true;
                  }
                  String pkg = currentPkg();
                  if (pkg == null || id == null) return false;
                  MediaBrowser b = lib.browser(pkg, browserServices().get(pkg));
                  MediaController c = b != null ? lib.controllerFor(b) : controllerForPkg(pkg);
                  if (c == null) return false;
                  pauseOthers(pkg);
                  selectedPkg = pkg;
                  c.getTransportControls().playFromMediaId(id, new Bundle());
                  SystemClock.sleep(900);
                  return true;
              }

              private boolean playSearch(String q) {
                  String pkg = currentPkg();
                  if (pkg == null || q == null || q.trim().isEmpty()) return false;
                  MediaController c = controllerForPkg(pkg);
                  if (c == null) return false;
                  pauseOthers(pkg);
                  selectedPkg = pkg;
                  c.getTransportControls().playFromSearch(q.trim(), new Bundle());
                  SystemClock.sleep(1500);
                  return true;
              }

              /** ส่งปุ่ม "เล่น" ไปที่แอปนั้นโดยตรง (สำรอง) */
              private void sendMediaButton(String pkg) {
                  long t = SystemClock.uptimeMillis();
                  for (int action : new int[]{KeyEvent.ACTION_DOWN, KeyEvent.ACTION_UP}) {
                      Intent i = new Intent(Intent.ACTION_MEDIA_BUTTON).setPackage(pkg);
                      i.putExtra(Intent.EXTRA_KEY_EVENT, new KeyEvent(t, t, action, KeyEvent.KEYCODE_MEDIA_PLAY, 0));
                      sendBroadcast(i);
                  }
              }

              // ------------------------------------------------------------------ Controls

              private boolean doAction(String action) {
                  AudioManager am = getSystemService(AudioManager.class);
                  switch (action) {
                      case "volup":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, 0);
                          return true;
                      case "voldown":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0);
                          return true;
                      case "mute":
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, 0);
                          return true;
                      case "playpause":
                      case "next":
                      case "prev":
                          break;
                      default:
                          return false;
                  }

                  MediaController c = controller();
                  if (c == null && selectedPkg != null && action.equals("playpause")) {
                      String pkg = selectedPkg;
                      startApp(pkg, browserServices().get(pkg));
                      SystemClock.sleep(1800);
                      return true;
                  }
                  if (c == null) {
                      // ยังไม่ได้สิทธิ์ หรือยังไม่มีแอปเล่น: ส่งปุ่มมีเดียให้ระบบแทน
                      int key = action.equals("next") ? KeyEvent.KEYCODE_MEDIA_NEXT
                              : action.equals("prev") ? KeyEvent.KEYCODE_MEDIA_PREVIOUS
                              : KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                      long now = SystemClock.uptimeMillis();
                      am.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_DOWN, key, 0));
                      am.dispatchMediaKeyEvent(new KeyEvent(now, now, KeyEvent.ACTION_UP, key, 0));
                  } else {
                      MediaController.TransportControls t = c.getTransportControls();
                      if (action.equals("next")) {
                          t.skipToNext();
                      } else if (action.equals("prev")) {
                          t.skipToPrevious();
                      } else if (isPlaying(c)) {
                          t.pause();
                      } else {
                          t.play();
                      }
                  }
                  SystemClock.sleep(350); // รอให้แอปเปลี่ยนเพลง/สถานะก่อนตอบกลับ
                  return true;
              }

              private String status() {
                  JSONObject o = new JSONObject();
                  try {
                      AudioManager am = getSystemService(AudioManager.class);
                      int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                      int cur = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                      o.put("volume", max > 0 ? Math.round(cur * 100f / max) : 0);
                      o.put("muted", am.isStreamMute(AudioManager.STREAM_MUSIC));

                      MediaController c = controller();
                      o.put("perm", mediaAccess);
                      if (c == null) {
                          String sel = selectedPkg;
                          o.put("state", "stopped");
                          o.put("title", "");
                          o.put("artist", "");
                          o.put("pkg", sel == null ? "" : sel);
                          o.put("player", sel == null ? "" : appLabel(sel));
                          o.put("art", "");
                      } else {
                          o.put("state", isPlaying(c) ? "playing" : "paused");
                          MediaMetadata md = c.getMetadata();
                          String title = title(c), artist = "";
                          if (md != null) {
                              artist = nz(md.getString(MediaMetadata.METADATA_KEY_ARTIST));
                              if (artist.isEmpty()) artist = nz(md.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST));
                          }
                          o.put("title", title);
                          o.put("artist", artist);
                          o.put("pkg", c.getPackageName());
                          o.put("player", appLabel(c.getPackageName()));
                          o.put("art", artBitmap(md) == null ? ""
                                  : Integer.toHexString((c.getPackageName() + title + artist).hashCode()));
                      }
                  } catch (Exception ignored) {
                  }
                  return o.toString();
              }

              private static String title(MediaController c) {
                  MediaMetadata md = c.getMetadata();
                  return md == null ? "" : nz(md.getString(MediaMetadata.METADATA_KEY_TITLE));
              }

              private byte[] albumArt() {
                  MediaController c = controller();
                  Bitmap b = c == null ? null : artBitmap(c.getMetadata());
                  if (b == null) return null;
                  if (b.getWidth() > 600) {
                      b = Bitmap.createScaledBitmap(b, 600, Math.max(1, 600 * b.getHeight() / b.getWidth()), true);
                  }
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  b.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                  return bo.toByteArray();
              }

              private static Bitmap artBitmap(MediaMetadata md) {
                  if (md == null) return null;
                  Bitmap b = md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART);
                  if (b == null) b = md.getBitmap(MediaMetadata.METADATA_KEY_ART);
                  if (b == null) b = md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON);
                  return b;
              }

              private byte[] icon(String pkg) {
                  if (pkg == null) return null;
                  byte[] cached = iconCache.get(pkg);
                  if (cached != null) return cached;
                  try {
                      Drawable d = getPackageManager().getApplicationIcon(pkg);
                      Bitmap b = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(b);
                      d.setBounds(0, 0, 96, 96);
                      d.draw(canvas);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      b.compress(Bitmap.CompressFormat.PNG, 100, bo);
                      byte[] png = bo.toByteArray();
                      iconCache.put(pkg, png);
                      return png;
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String appLabel(String pkg) {
                  try {
                      PackageManager pm = getPackageManager();
                      return pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (PackageManager.NameNotFoundException e) {
                      return pkg;
                  }
              }

              private static String nz(String s) {
                  return s == null ? "" : s;
              }

              // ------------------------------------------------------------------ misc

              private Notification buildNotification() {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(
                          CHANNEL, "รีโมทเพลง", NotificationManager.IMPORTANCE_LOW));
                  PendingIntent pi = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  String url = Util.url(this);
                  return new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle("รีโมทเพลงกำลังทำงาน")
                          .setContentText(url == null ? "ยังไม่ได้ต่อ Wi-Fi" : url)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
              }

              /** ข้อมูลให้ iPhone ติดตั้งหน้ารีโมทเป็นเว็บแอปเต็มจอ */
              private String manifestJson() {
                  try {
                      JSONObject m = new JSONObject();
                      m.put("name", "รีโมท R4");
                      m.put("short_name", "รีโมท R4");
                      m.put("start_url", "/?k=" + token);
                      m.put("scope", "/");
                      m.put("display", "standalone");
                      m.put("orientation", "portrait");
                      m.put("background_color", "#0f1115");
                      m.put("theme_color", "#0f1115");
                      JSONArray icons = new JSONArray();
                      for (int size : new int[]{180, 512}) {
                          JSONObject i = new JSONObject();
                          i.put("src", "/icon-" + size + ".png");
                          i.put("sizes", size + "x" + size);
                          i.put("type", "image/png");
                          icons.put(i);
                      }
                      m.put("icons", icons);
                      return m.toString();
                  } catch (JSONException e) {
                      return "{}";
                  }
              }

              private byte[] readAsset(String name) {
                  try (InputStream is = getAssets().open(name)) {
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                      return bo.toByteArray();
                  } catch (IOException e) {
                      return "<h2>missing page</h2>".getBytes(StandardCharsets.UTF_8);
                  }
              }
          }
