          package com.r4remote;

          import android.content.ComponentName;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaDescription;
          import android.media.browse.MediaBrowser;
          import android.media.session.MediaController;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.atomic.AtomicReference;

          /**
           * คุยกับคลังเพลงของแอปผ่าน MediaBrowserService (แบบเดียวกับ Android Auto):
           * ไล่ดูเพลย์ลิสต์/อัลบั้ม ค้นหา และอ่านคิวเพลง
           * ทุกเมธอดที่รอผลต้องเรียกจาก thread ของ HTTP ไม่ใช่ main thread
           */
          final class Library {
              private static final int MAX_ITEMS = 300;

              private final Context ctx;
              private final Handler main;
              private final Map<String, Object> images = new ConcurrentHashMap<>();
              private final AtomicInteger imageSeq = new AtomicInteger();
              private Conn conn;

              private static final class Conn {
                  final String pkg;
                  final CountDownLatch ready = new CountDownLatch(1);
                  volatile MediaBrowser browser;
                  volatile boolean ok, dead;

                  Conn(String pkg) {
                      this.pkg = pkg;
                  }
              }

              Library(Context ctx, Handler main) {
                  this.ctx = ctx;
                  this.main = main;
              }

              /** เชื่อมต่อคลังเพลงของแอป คืน null ถ้าแอปไม่อนุญาตหรือไม่ตอบ */
              MediaBrowser browser(String pkg, String serviceClass) {
                  if (pkg == null || serviceClass == null) return null;
                  Conn c;
                  synchronized (this) {
                      if (conn != null && conn.pkg.equals(pkg) && !conn.dead) {
                          c = conn;
                      } else {
                          final Conn old = conn;
                          if (old != null) {
                              main.post(() -> {
                                  try {
                                      if (old.browser != null) old.browser.disconnect();
                                  } catch (Exception ignored) {
                                  }
                              });
                          }
                          c = new Conn(pkg);
                          conn = c;
                          final Conn cc = c;
                          main.post(() -> {
                              try {
                                  cc.browser = new MediaBrowser(ctx, new ComponentName(pkg, serviceClass),
                                          new MediaBrowser.ConnectionCallback() {
                                              @Override
                                              public void onConnected() {
                                                  cc.ok = true;
                                                  cc.ready.countDown();
                                              }

                                              @Override
                                              public void onConnectionFailed() {
                                                  cc.dead = true;
                                                  cc.ready.countDown();
                                              }

                                              @Override
                                              public void onConnectionSuspended() {
                                                  cc.ok = false;
                                                  cc.dead = true;
                                              }
                                          }, null);
                                  cc.browser.connect();
                              } catch (Exception e) {
                                  cc.dead = true;
                                  cc.ready.countDown();
                              }
                          });
                      }
                  }
                  await(c.ready, 6);
                  return c.ok && !c.dead ? c.browser : null;
              }

              MediaController controllerFor(MediaBrowser b) {
                  return new MediaController(ctx, b.getSessionToken());
              }

              /** รายการในโฟลเดอร์ (parentId ว่าง = หน้าแรก) คืน null ถ้าแอปไม่ให้ดู */
              List<MediaBrowser.MediaItem> children(MediaBrowser b, String parentId) {
                  AtomicReference<List<MediaBrowser.MediaItem>> res = new AtomicReference<>();
                  CountDownLatch done = new CountDownLatch(1);
                  main.post(() -> {
                      try {
                          String id = (parentId == null || parentId.isEmpty()) ? b.getRoot() : parentId;
                          b.subscribe(id, new MediaBrowser.SubscriptionCallback() {
                              @Override
                              public void onChildrenLoaded(String pid, List<MediaBrowser.MediaItem> children) {
                                  res.set(children);
                                  try {
                                      b.unsubscribe(pid);
                                  } catch (Exception ignored) {
                                  }
                                  done.countDown();
                              }

                              @Override
                              public void onError(String pid) {
                                  done.countDown();
                              }
                          });
                      } catch (Exception e) {
                          done.countDown();
                      }
                  });
                  await(done, 8);
                  return res.get();
              }

              JSONArray itemsJson(List<MediaBrowser.MediaItem> items) throws JSONException {
                  JSONArray arr = new JSONArray();
                  if (items == null) return arr;
                  for (MediaBrowser.MediaItem it : items) {
                      if (arr.length() >= MAX_ITEMS) break;
                      if (it.getMediaId() == null) continue;
                      JSONObject o = descJson(it.getDescription());
                      o.put("id", it.getMediaId());
                      o.put("browsable", it.isBrowsable());
                      o.put("playable", it.isPlayable());
                      arr.put(o);
                  }
                  return arr;
              }

              JSONObject queueJson(MediaController c) throws JSONException {
                  JSONObject o = new JSONObject();
                  JSONArray arr = new JSONArray();
                  PlaybackState st = c.getPlaybackState();
                  long active = st == null ? MediaSession.QueueItem.UNKNOWN_ID : st.getActiveQueueItemId();
                  List<MediaSession.QueueItem> q = c.getQueue();
                  if (q != null) {
                      for (MediaSession.QueueItem qi : q) {
                          if (arr.length() >= MAX_ITEMS) break;
                          JSONObject j = descJson(qi.getDescription());
                          j.put("qid", String.valueOf(qi.getQueueId()));
                          j.put("active", qi.getQueueId() == active);
                          arr.put(j);
                      }
                  }
                  CharSequence title = c.getQueueTitle();
                  o.put("title", title == null ? "" : title.toString());
                  o.put("items", arr);
                  return o;
              }

              private JSONObject descJson(MediaDescription d) throws JSONException {
                  return entryJson(d.getTitle(), d.getSubtitle(), d.getIconUri(), d.getIconBitmap());
              }

              /** ข้อมูลหนึ่งรายการ (ใช้ร่วมกับผลค้นหาใน Searcher) */
              JSONObject entryJson(CharSequence title, CharSequence subtitle, Uri iconUri, Bitmap iconBitmap)
                      throws JSONException {
                  JSONObject o = new JSONObject();
                  o.put("title", title == null ? "" : title.toString());
                  o.put("subtitle", subtitle == null ? "" : subtitle.toString());
                  o.put("icon", icon(iconUri, iconBitmap));
                  return o;
              }

              /** รูปปก: ลิงก์ http ส่งต่อตรงๆ ส่วนรูปในเครื่องจะได้รหัส "#n" ให้หน้าเว็บขอผ่าน /api/img */
              private String icon(Uri u, Bitmap bitmap) {
                  if (u != null && ("http".equals(u.getScheme()) || "https".equals(u.getScheme()))) {
                      return u.toString();
                  }
                  Object src = bitmap != null ? bitmap : u;
                  if (src == null) return "";
                  if (images.size() > 600) images.clear();
                  String key = Integer.toString(imageSeq.incrementAndGet());
                  images.put(key, src);
                  return "#" + key;
              }

              byte[] image(String key) {
                  Object src = key == null ? null : images.get(key);
                  if (src == null) return null;
                  try {
                      Bitmap b = src instanceof Bitmap ? (Bitmap) src : null;
                      if (b == null) {
                          try (InputStream is = ctx.getContentResolver().openInputStream((Uri) src)) {
                              b = BitmapFactory.decodeStream(is);
                          }
                      }
                      if (b == null) return null;
                      if (b.getWidth() > 200) {
                          b = Bitmap.createScaledBitmap(b, 200, Math.max(1, 200 * b.getHeight() / b.getWidth()), true);
                      }
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      b.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                      return bo.toByteArray();
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static void await(CountDownLatch l, int seconds) {
                  try {
                      l.await(seconds, TimeUnit.SECONDS);
                  } catch (InterruptedException ignored) {
                  }
              }
          }
