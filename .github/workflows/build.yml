          package com.r4remote;

          import android.content.ComponentName;
          import android.content.Context;
          import android.os.Bundle;
          import android.os.Handler;
          import android.support.v4.media.MediaBrowserCompat;
          import android.support.v4.media.MediaDescriptionCompat;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.util.List;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicReference;

          /**
           * ค้นหาเพลงในแอปผ่าน MediaBrowserCompat (androidx.media) แบบเดียวกับช่องค้นหาของ Android Auto
           * เรียกจาก thread ของ HTTP เท่านั้น
           */
          final class Searcher {
              private static final int MAX_ITEMS = 100;

              private final Context ctx;
              private final Handler main;
              private Conn conn;

              private static final class Conn {
                  final String pkg;
                  final CountDownLatch ready = new CountDownLatch(1);
                  volatile MediaBrowserCompat browser;
                  volatile boolean ok, dead;

                  Conn(String pkg) {
                      this.pkg = pkg;
                  }
              }

              Searcher(Context ctx, Handler main) {
                  this.ctx = ctx;
                  this.main = main;
              }

              private MediaBrowserCompat connect(String pkg, String serviceClass) {
                  if (pkg == null || serviceClass == null) return null;
                  Conn c;
                  synchronized (this) {
                      if (conn != null && conn.pkg.equals(pkg) && !conn.dead) {
                          c = conn;
                      } else {
                          final Conn old = conn;
                          if (old != null) {
                              main.post(() -> {
                                  try {
                                      if (old.browser != null) old.browser.disconnect();
                                  } catch (Exception ignored) {
                                  }
                              });
                          }
                          c = new Conn(pkg);
                          conn = c;
                          final Conn cc = c;
                          main.post(() -> {
                              try {
                                  cc.browser = new MediaBrowserCompat(ctx, new ComponentName(pkg, serviceClass),
                                          new MediaBrowserCompat.ConnectionCallback() {
                                              @Override
                                              public void onConnected() {
                                                  cc.ok = true;
                                                  cc.ready.countDown();
                                              }

                                              @Override
                                              public void onConnectionFailed() {
                                                  cc.dead = true;
                                                  cc.ready.countDown();
                                              }

                                              @Override
                                              public void onConnectionSuspended() {
                                                  cc.ok = false;
                                                  cc.dead = true;
                                              }
                                          }, null);
                                  cc.browser.connect();
                              } catch (Exception e) {
                                  cc.dead = true;
                                  cc.ready.countDown();
                              }
                          });
                      }
                  }
                  await(c.ready, 6);
                  return c.ok && !c.dead ? c.browser : null;
              }

              /** คืน null ถ้าแอปไม่รองรับการค้นหาจากภายนอก */
              List<MediaBrowserCompat.MediaItem> search(String pkg, String serviceClass, String query) {
                  MediaBrowserCompat b = connect(pkg, serviceClass);
                  if (b == null) return null;
                  AtomicReference<List<MediaBrowserCompat.MediaItem>> res = new AtomicReference<>();
                  CountDownLatch done = new CountDownLatch(1);
                  main.post(() -> {
                      try {
                          b.search(query, new Bundle(), new MediaBrowserCompat.SearchCallback() {
                              @Override
                              public void onSearchResult(String q, Bundle extras, List<MediaBrowserCompat.MediaItem> items) {
                                  res.set(items);
                                  done.countDown();
                              }

                              @Override
                              public void onError(String q, Bundle extras) {
                                  done.countDown();
                              }
                          });
                      } catch (Exception e) {
                          done.countDown();
                      }
                  });
                  await(done, 12);
                  return res.get();
              }

              JSONArray itemsJson(Library lib, List<MediaBrowserCompat.MediaItem> items) throws JSONException {
                  JSONArray arr = new JSONArray();
                  if (items == null) return arr;
                  for (MediaBrowserCompat.MediaItem it : items) {
                      if (arr.length() >= MAX_ITEMS) break;
                      if (it.getMediaId() == null) continue;
                      MediaDescriptionCompat d = it.getDescription();
                      JSONObject o = lib.entryJson(d.getTitle(), d.getSubtitle(), d.getIconUri(), d.getIconBitmap());
                      o.put("id", it.getMediaId());
                      o.put("browsable", it.isBrowsable());
                      o.put("playable", it.isPlayable());
                      arr.put(o);
                  }
                  return arr;
              }

              private static void await(CountDownLatch l, int seconds) {
                  try {
                      l.await(seconds, TimeUnit.SECONDS);
                  } catch (InterruptedException ignored) {
                  }
              }
          }
