# รีโมทเพลง R4 v1.9 — ไฟล์เดียวจบ
# วางไฟล์นี้ไว้ที่ .github/workflows/build.yml ใน GitHub repo
# GitHub จะสร้างโปรเจกต์และไฟล์ R4Remote.apk ให้เอง (ดูที่หน้า Releases)
name: Build R4Remote APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          set -e
          mkdir -p src/app && cd src
          echo '' | base64 -d > app/r4.jks
          mkdir -p app/src/main/assets
          echo '' | base64 -d > app/src/main/assets/icon-180.png
          mkdir -p app/src/main/assets
          echo '' | base64 -d > app/src/main/assets/icon-512.png
          cat > settings.gradle <<'R4EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "R4Remote"
          include ':app'
          R4EOF
          cat > build.gradle <<'R4EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          R4EOF
          cat > gradle.properties <<'R4EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          android.useAndroidX=true
          R4EOF
          mkdir -p app
          cat > app/build.gradle <<'R4EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.r4remote'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.r4remote'
                  minSdk 26
                  targetSdk 33
                  versionCode 10
                  versionName '1.9'
              }

              // ใช้กุญแจเซ็นแอปตัวเดิมทุกครั้ง เพื่อให้ติดตั้งเวอร์ชันใหม่ทับได้โดยไม่ต้องลบแอปเก่า
              signingConfigs {
                  debug {
                      storeFile file('r4.jks')
                      storePassword 'r4remote'
                      keyAlias 'r4'
                      keyPassword 'r4remote'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.zxing:core:3.5.3'
              implementation 'androidx.media:media:1.7.0'
          }
          R4EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'R4EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <!-- ประกาศชื่อ r4remote.local ในวง Wi-Fi -->
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <!-- ให้เปิดเพลงใน YouTube Music จากผลค้นหาได้ขณะแอปอยู่เบื้องหลัง -->
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <!-- เพื่อแสดงชื่อแอปที่กำลังเล่น (เช่น HiBy Music, Spotify) -->
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_media_play"
                  android:label="รีโมทเพลง R4"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RemoteService"
                      android:exported="false" />

                  <!-- ต้องได้สิทธิ์ "เข้าถึงการแจ้งเตือน" จึงจะควบคุม/อ่านข้อมูลเพลงจากทุกแอปได้ -->
                  <service
                      android:name=".MediaListener"
                      android:exported="true"
                      android:label="รีโมทเพลง R4"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          R4EOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'R4EOF'
          <!doctype html>
          <html lang="th"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="รีโมท R4">
          <meta name="theme-color" content="#0f1115">
          <link rel="apple-touch-icon" href="/icon-180.png">
          <link rel="icon" type="image/png" href="/icon-180.png">
          <link rel="manifest" href="/manifest.webmanifest?k=__TOKEN__">
          <title>รีโมท R4</title>
          <style>
          :root{--bg:#0f1115;--card:#1a1d24;--card2:#22262f;--fg:#f2f3f5;--mut:#8b919c;--acc:#1ed760}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;height:100%;overscroll-behavior:none;background:var(--bg);color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set",sans-serif;user-select:none;-webkit-user-select:none}
          main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:440px;margin:0 auto;
           padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px)}
          .art{width:min(72vw,300px);aspect-ratio:1;margin:0 auto;border-radius:18px;background:var(--card);
           display:grid;place-items:center;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
          .art img{width:100%;height:100%;object-fit:cover;display:none}
          .art svg{width:64px;height:64px;fill:#333844}
          .np{text-align:center}
          .app{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--card);color:var(--acc);
           border-radius:999px;padding:7px 14px 7px 8px;font:600 13px -apple-system,sans-serif;letter-spacing:.04em;
           width:auto;height:auto;max-width:100%}
          .app:active{background:var(--card2);transform:scale(.96)}
          .app img{width:22px;height:22px;border-radius:6px;display:none}
          .app .chev{width:14px;height:14px;fill:var(--mut)}
          .title{font-size:22px;font-weight:700;margin:12px 0 4px;min-height:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .artist{font-size:15px;color:var(--mut);min-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .row{display:flex;justify-content:center;align-items:center;gap:28px}
          button.c{border:0;background:var(--card);color:var(--fg);border-radius:50%;display:grid;place-items:center;
           width:72px;height:72px;transition:transform .08s,background .15s}
          button.c:active{transform:scale(.9);background:#262a33}
          button.big{width:92px;height:92px;background:var(--fg);color:var(--bg)}
          button.big:active{background:#cfd2d8}
          button.sm{width:56px;height:56px}
          .c svg{width:30px;height:30px;fill:currentColor}
          .big svg{width:40px;height:40px}
          .sm svg{width:24px;height:24px}
          .vol{font-size:14px;color:var(--mut);min-width:64px;text-align:center}
          .status{text-align:center;font-size:13px;color:var(--mut);min-height:16px}
          .status.err{color:#ff6b6b}

          /* แผ่นเลือกแอป */
          .sheet{position:fixed;inset:0;display:none;z-index:10}
          .sheet.open{display:block}
          .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
          .panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);
           border-radius:20px 20px 0 0;max-height:75%;display:flex;flex-direction:column;
           padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
          .handle{width:40px;height:5px;border-radius:3px;background:#3a3f4a;margin:10px auto 4px}
          .panel h3{margin:6px 20px 10px;font-size:17px}
          .list{overflow-y:auto;padding:0 10px 14px;min-height:0;flex:1 1 auto}
          .item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px}
          .item:active{background:var(--card2)}
          .item.sel{background:var(--card2)}
          .item img{width:44px;height:44px;border-radius:11px;background:#2a2e38;flex:none}
          .item .t{flex:1;min-width:0}
          .item .n{font-size:16px;font-weight:600}
          .item .s{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .item .s.on{color:var(--acc)}
          .item .ck{width:22px;height:22px;fill:var(--acc);visibility:hidden;flex:none}
          .item.sel .ck{visibility:visible}
          .item.busy{opacity:.5}
          .empty{color:var(--mut);text-align:center;padding:24px;font-size:14px;line-height:1.5}

          /* เลือกเพลง */
          .pick{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;border:0;border-radius:999px;
           background:var(--card);color:var(--fg);font:600 15px -apple-system,sans-serif;padding:13px 22px}
          .picks{display:flex;justify-content:center;gap:12px}
          .picks .pick{margin:0}
          .pick:active{background:var(--card2);transform:scale(.97)}
          .pick svg{width:20px;height:20px;fill:var(--acc)}
          .panel.tall{top:max(12px, env(safe-area-inset-top));height:auto;max-height:none}
          .panel{overflow:hidden}
          .panel.tall .list{flex:1;min-height:0;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
          body.lock{overflow:hidden}
          .top{position:relative;height:40px}
          .x{position:absolute;right:12px;top:6px;border:0;background:none;color:var(--acc);font:600 15px -apple-system,sans-serif;padding:6px 8px}
          .tabs{display:flex;gap:6px;margin:4px 14px 10px;background:#13161c;border-radius:12px;padding:4px}
          .tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 14px -apple-system,sans-serif;padding:9px 0;border-radius:9px}
          .tabs button.on{background:var(--card2);color:var(--fg)}
          .bar{display:flex;align-items:center;gap:8px;margin:0 14px 8px;min-height:0}
          .bar.hide{display:none}
          .back{border:0;background:var(--card2);color:var(--fg);border-radius:10px;padding:8px 12px;font:600 14px -apple-system,sans-serif;flex:none}
          .crumb{flex:1;min-width:0;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .sbox{flex:1;min-width:0;border:0;border-radius:10px;background:#13161c;color:var(--fg);font-size:16px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
          .go{border:0;background:var(--acc);color:#04130a;border-radius:10px;padding:10px 14px;font:700 14px -apple-system,sans-serif;flex:none}
          .quick{display:block;width:calc(100% - 28px);margin:0 14px 8px;border:0;border-radius:12px;background:var(--card2);
           color:var(--acc);font:600 15px -apple-system,sans-serif;padding:12px}
          .quick.hide{display:none}
          .item .ph{width:44px;height:44px;border-radius:11px;background:#2a2e38;flex:none;display:grid;place-items:center}
          .item .ph svg{width:22px;height:22px;fill:#555b68}
          .item.now .n{color:var(--acc)}
          .item .go2{border:0;background:var(--acc);color:#04130a;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
          .item .go2 svg{width:18px;height:18px;fill:currentColor}
          .item .arr{width:20px;height:20px;fill:#555b68;flex:none}
          @keyframes up{from{transform:translateY(100%)}to{transform:none}}
          @keyframes fade{from{opacity:0}to{opacity:1}}
          </style></head><body>
          <main>
           <div class="art"><img id="art" alt=""><svg id="noart" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>
           <div class="np">
            <button class="app" id="appbtn" aria-label="เลือกแอป">
             <img id="appicon" alt="">
             <span id="player">เลือกแอป</span>
             <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="title" id="title">กำลังเชื่อมต่อ…</div>
            <div class="artist" id="artist"></div>
           </div>
           <div class="row">
            <button class="c" data-a="prev" aria-label="เพลงก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
            <button class="c big" data-a="playpause" aria-label="เล่น/หยุด"><svg id="pp" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
            <button class="c" data-a="next" aria-label="เพลงถัดไป"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
           </div>
           <div class="row">
            <button class="c sm" data-a="voldown" aria-label="ลดเสียง"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14z"/></svg></button>
            <div class="vol" id="vol">–</div>
            <button class="c sm" data-a="volup" aria-label="เพิ่มเสียง"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
            <button class="c sm" data-a="mute" aria-label="ปิดเสียง"><svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.45 2.45c.03-.2.05-.42.05-.65zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9zM12 4 9.91 6.09 12 8.18z"/></svg></button>
           </div>
           <div class="picks">
            <button class="pick" id="searchbtn"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>ค้นหา</button>
            <button class="pick" id="pickbtn"><svg viewBox="0 0 24 24"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg>เลือกเพลง</button>
           </div>
           <div class="status" id="st"></div>
          </main>

          <div class="sheet" id="lib">
           <div class="backdrop" data-close="lib"></div>
           <div class="panel tall">
            <div class="top"><div class="handle"></div><button class="x" data-close="lib">ปิด</button></div>
            <div class="tabs" id="tabs">
             <button data-tab="queue" class="on">คิว</button>
             <button data-tab="browse">คลังเพลง</button>
             <button data-tab="search">ค้นหา</button>
            </div>
            <div class="bar hide" id="navbar"><button class="back" id="back">‹ ย้อนกลับ</button><div class="crumb" id="crumb"></div></div>
            <form class="bar hide" id="sform" autocomplete="off">
             <input class="sbox" id="sq" type="search" enterkeyhint="search" placeholder="ชื่อเพลง ศิลปิน หรืออัลบั้ม">
             <button class="go" type="submit">ค้นหา</button>
            </form>
            <button class="quick hide" id="quick">▶ เล่นผลลัพธ์แรกเลย</button>
            <div class="list" id="liblist"></div>
           </div>
          </div>

          <div class="sheet" id="sheet">
           <div class="backdrop" id="backdrop"></div>
           <div class="panel">
            <div class="handle"></div>
            <h3>เลือกแอปที่จะเล่นบน R4</h3>
            <div class="list" id="list"><div class="empty">กำลังโหลด…</div></div>
           </div>
          </div>

          <script>
          const K = new URLSearchParams(location.search).get("k") || "";
          const Q = "?k=" + encodeURIComponent(K);
          const $ = id => document.getElementById(id);
          const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
          const CHECK = '<svg class="ck" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
          let artKey = null, iconPkg = null;

          $("art").onload = () => { $("art").style.display = "block"; $("noart").style.display = "none"; };
          $("art").onerror = () => { $("art").style.display = "none"; $("noart").style.display = "block"; };
          $("appicon").onload = () => { $("appicon").style.display = "block"; };
          $("appicon").onerror = () => { $("appicon").style.display = "none"; };

          const iconUrl = p => "/api/icon" + Q + "&pkg=" + encodeURIComponent(p);

          function show(d){
            $("player").textContent = d.player || "เลือกแอป";
            if (d.pkg !== iconPkg) {
              iconPkg = d.pkg;
              if (d.pkg) $("appicon").src = iconUrl(d.pkg); else $("appicon").style.display = "none";
            }
            $("title").textContent = d.title || (d.state === "stopped" ? (d.player ? "แตะ ▶ เพื่อเริ่มเล่น" : "ไม่มีเพลงกำลังเล่น") : "");
            $("artist").textContent = d.artist || "";
            $("pp").innerHTML = d.state === "playing" ? PAUSE : PLAY;
            $("vol").textContent = d.muted ? "ปิดเสียง" : "เสียง " + d.volume + "%";
            if (d.art !== artKey) {
              artKey = d.art;
              if (d.art) $("art").src = "/api/art" + Q + "&v=" + d.art;
              else { $("art").removeAttribute("src"); $("art").style.display = "none"; $("noart").style.display = "block"; }
            }
            if (d.perm === false) {
              $("st").textContent = "บน R4 ยังไม่ได้อนุญาต “เข้าถึงการแจ้งเตือน” — ใช้ได้แค่ปุ่มพื้นฐาน";
              $("st").className = "status err";
            } else { $("st").textContent = ""; $("st").className = "status"; }
          }
          function fail(){ $("st").textContent = "เชื่อมต่อ R4 ไม่ได้ — ตรวจว่าเปิดรีโมทอยู่และต่อ Wi-Fi เดียวกัน"; $("st").className = "status err"; }

          async function call(path, opts, extra){
            try{
              const r = await fetch(path + Q + (extra || ""), opts);
              if(!r.ok) throw 0;
              show(await r.json());
              return true;
            }catch(e){ fail(); return false; }
          }
          document.querySelectorAll("button[data-a]").forEach(b =>
            b.addEventListener("click", () => call("/api/" + b.dataset.a, {method:"POST"})));

          /* ---------- เลือกแอป ---------- */
          function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

          async function openSheet(){
            $("sheet").classList.add("open"); lockPage(true);
            $("list").innerHTML = '<div class="empty">กำลังโหลด…</div>';
            try{
              const r = await fetch("/api/apps" + Q);
              if(!r.ok) throw 0;
              const apps = await r.json();
              if (!apps.length) { $("list").innerHTML = '<div class="empty">ไม่พบแอปเพลงบน R4</div>'; return; }
              $("list").innerHTML = apps.map(a => {
                const sub = a.state === "playing" ? "กำลังเล่น" + (a.title ? " · " + a.title : "")
                          : a.state === "paused" ? "หยุดชั่วคราว" + (a.title ? " · " + a.title : "")
                          : "แตะเพื่อเปิดและเล่น";
                return '<div class="item' + (a.selected ? " sel" : "") + '" data-pkg="' + esc(a.pkg) + '">'
                  + '<img src="' + iconUrl(a.pkg) + '" alt="">'
                  + '<div class="t"><div class="n">' + esc(a.label) + '</div>'
                  + '<div class="s' + (a.state === "playing" ? " on" : "") + '">' + esc(sub) + '</div></div>'
                  + CHECK + '</div>';
              }).join("");
            }catch(e){ $("list").innerHTML = '<div class="empty">โหลดรายการแอปไม่ได้</div>'; }
          }
          function closeSheet(){ $("sheet").classList.remove("open"); lockPage(false); }

          $("appbtn").addEventListener("click", openSheet);
          $("backdrop").addEventListener("click", closeSheet);
          $("list").addEventListener("click", async e => {
            const item = e.target.closest(".item");
            if (!item) return;
            item.classList.add("busy");
            item.querySelector(".s").textContent = "กำลังสลับ…";
            await call("/api/select", {method:"POST"}, "&pkg=" + encodeURIComponent(item.dataset.pkg));
            closeSheet();
          });

          /* ---------- เลือกเพลง: คิว / คลังเพลง / ค้นหา ---------- */
          const NOTE = '<div class="ph"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></div>';
          const FOLDER = '<div class="ph"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg></div>';
          const ARROW = '<svg class="arr" viewBox="0 0 24 24"><path d="M10 6 8.6 7.4 13.2 12l-4.6 4.6L10 18l6-6z"/></svg>';
          const PLAYBTN = '<button class="go2" aria-label="เล่น"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>';
          let tab = "queue", stack = [], lastQuery = "";

          function imgSrc(icon){ return icon ? (icon[0] === "#" ? "/api/img" + Q + "&i=" + encodeURIComponent(icon.slice(1)) : icon) : ""; }

          async function getJSON(path, extra){
            const r = await fetch(path + Q + (extra || ""));
            if (!r.ok) throw 0;
            return r.json();
          }

          function msg(text){ $("liblist").scrollTop = 0; $("liblist").innerHTML = '<div class="empty">' + esc(text) + '</div>'; }

          function render(items, kind){
            $("liblist").innerHTML = items.map(it => {
              const folder = kind === "media" && it.browsable;
              const ph = folder ? FOLDER : NOTE;
              const pic = it.icon ? '<img src="' + esc(imgSrc(it.icon)) + '" alt="">' : ph;
              const id = kind === "queue" ? it.qid : it.id;
              const tail = folder ? (it.playable ? PLAYBTN : ARROW) : "";
              return '<div class="item' + (it.active ? " now" : "") + '" data-kind="' + kind + '" data-id="' + esc(id)
                + '" data-b="' + (folder ? 1 : 0) + '" data-title="' + esc(it.title) + '">'
                + pic + '<div class="t"><div class="n">' + esc(it.title || "(ไม่มีชื่อ)") + '</div>'
                + (it.subtitle ? '<div class="s">' + esc(it.subtitle) + '</div>' : "") + '</div>' + tail + '</div>';
            }).join("");
            // รูปที่โหลดไม่ขึ้นให้ใช้ไอคอนแทน
            $("liblist").querySelectorAll("img").forEach(img => img.onerror = () => {
              img.outerHTML = img.closest(".item").dataset.b === "1" ? FOLDER : NOTE;
            });
          }

          function setTab(t, noLoad){
            tab = t;
            $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
            $("sform").classList.toggle("hide", t !== "search");
            $("navbar").classList.toggle("hide", t !== "browse" || !stack.length);
            $("quick").classList.add("hide");
            if (noLoad) return;
            if (t === "queue") loadQueue();
            else if (t === "browse") loadBrowse();
            else if (lastQuery) runSearch(lastQuery);
            else msg("พิมพ์ชื่อเพลง ศิลปิน หรืออัลบั้ม แล้วแตะค้นหา");
          }

          async function loadQueue(){
            msg("กำลังโหลดคิว…");
            try{
              const d = await getJSON("/api/queue");
              if (!d.items.length) return msg(d.msg || "คิวว่าง");
              render(d.items, "queue");
              const list = $("liblist"), now = list.querySelector(".item.now");
              list.scrollTop = now ? Math.max(0, now.offsetTop - list.clientHeight / 2 + now.offsetHeight / 2) : 0;
            }catch(e){ msg("โหลดคิวไม่ได้"); }
          }

          async function loadBrowse(){
            const cur = stack[stack.length - 1];
            $("navbar").classList.toggle("hide", !stack.length);
            $("crumb").textContent = stack.map(s => s.title).join(" › ");
            msg("กำลังโหลด…");
            try{
              const d = await getJSON("/api/browse", cur ? "&id=" + encodeURIComponent(cur.id) : "");
              if (!d.items.length) return msg(d.msg || "ไม่มีรายการ");
              render(d.items, "media");
            }catch(e){ msg("โหลดคลังเพลงไม่ได้"); }
          }

          async function runSearch(q){
            lastQuery = q;
            $("quick").classList.remove("hide");
            msg("กำลังค้นหา…");
            try{
              const d = await getJSON("/api/search", "&q=" + encodeURIComponent(q));
              if (!d.items.length) return msg(d.msg || "ไม่พบเพลงที่ค้นหา");
              render(d.items, "media");
            }catch(e){ msg("ค้นหาไม่ได้"); }
          }

          async function play(path, extra){
            msg("กำลังเล่น…");
            if (await call(path, {method: "POST"}, extra)) { $("lib").classList.remove("open"); lockPage(false); }
            else msg("สั่งเล่นไม่ได้ ลองอีกครั้ง");
          }

          $("pickbtn").addEventListener("click", () => { $("lib").classList.add("open"); lockPage(true); setTab(tab); });
          $("searchbtn").addEventListener("click", () => {
            $("lib").classList.add("open"); lockPage(true); setTab("search");
            setTimeout(() => $("sq").focus(), 50);
          });
          function lockPage(on){ document.body.classList.toggle("lock", on); }
          document.querySelectorAll("[data-close]").forEach(el =>
            el.addEventListener("click", () => { $(el.dataset.close).classList.remove("open"); lockPage(false); }));
          $("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
          $("back").addEventListener("click", () => { stack.pop(); loadBrowse(); });
          $("sform").addEventListener("submit", e => {
            e.preventDefault();
            const q = $("sq").value.trim();
            if (!q) return;
            $("sq").blur();
            runSearch(q);
          });
          $("quick").addEventListener("click", () => { if (lastQuery) play("/api/searchplay", "&q=" + encodeURIComponent(lastQuery)); });
          $("liblist").addEventListener("click", e => {
            const item = e.target.closest(".item");
            if (!item) return;
            const id = item.dataset.id;
            if (item.dataset.kind === "queue") return play("/api/queue/play", "&id=" + encodeURIComponent(id));
            if (item.dataset.b === "1" && !e.target.closest(".go2")) {
              if (tab === "search") { stack = []; setTab("browse", true); }
              stack.push({id, title: item.dataset.title || "…"});
              return loadBrowse();
            }
            play("/api/browse/play", "&id=" + encodeURIComponent(id));
          });

          call("/api/status");
          setInterval(() => { if(!document.hidden && !document.querySelector(".sheet.open")) call("/api/status"); }, 2500);
          document.addEventListener("visibilitychange", () => { if(!document.hidden) call("/api/status"); });
          </script>
          </body></html>
