          mkdir -p app/src/main/java/com/r4remote
          cat > app/src/main/java/com/r4remote/MainActivity.java <<'R4EOF'
          package com.r4remote;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import com.google.zxing.BarcodeFormat;
          import com.google.zxing.common.BitMatrix;
          import com.google.zxing.qrcode.QRCodeWriter;

          public class MainActivity extends Activity {
              private static final int BG = Color.parseColor("#0f1115");
              private static final int FG = Color.parseColor("#f2f3f5");
              private static final int MUTED = Color.parseColor("#8b919c");
              private static final int ACCENT = Color.parseColor("#1ed760");

              private TextView statusText, urlText, hintText;
              private ImageView qr;
              private Button accessBtn, batteryBtn, toggleBtn;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(BG);
                  int pad = dp(20);

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER_HORIZONTAL);
                  col.setPadding(pad, pad, pad, pad);
                  col.setBackgroundColor(BG);

                  TextView title = text("รีโมทเพลง R4", 24, FG);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  col.addView(title);

                  statusText = text("", 15, MUTED);
                  statusText.setPadding(0, dp(6), 0, dp(14));
                  col.addView(statusText);

                  accessBtn = button(v -> startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)));
                  col.addView(accessBtn);

                  batteryBtn = button(v -> {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:" + getPackageName()));
                      try {
                          startActivity(i);
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                      }
                  });
                  col.addView(batteryBtn);

                  toggleBtn = button(v -> {
                      boolean run = !Util.wantRunning(this);
                      Util.setWantRunning(this, run);
                      if (run) Util.startService(this);
                      else Util.stopService(this);
                      refresh();
                  });
                  col.addView(toggleBtn);

                  qr = new ImageView(this);
                  LinearLayout.LayoutParams qp = new LinearLayout.LayoutParams(dp(240), dp(240));
                  qp.topMargin = dp(20);
                  col.addView(qr, qp);

                  urlText = text("", 15, FG);
                  urlText.setTextIsSelectable(true);
                  urlText.setPadding(0, dp(10), 0, 0);
                  col.addView(urlText);

                  hintText = text("", 13, MUTED);
                  hintText.setPadding(0, dp(10), 0, 0);
                  col.addView(hintText);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  sv.setFillViewport(true);
                  sv.addView(col);
                  setContentView(sv);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
                  // ถ้าเคยเปิดไว้แต่ service ถูกระบบปิด ให้เปิดใหม่
                  if (Util.wantRunning(this)) Util.startService(this);
              }

              private void refresh() {
                  handler.removeCallbacksAndMessages(null);
                  boolean access = Util.hasMediaAccess(this);
                  boolean battery = getSystemService(PowerManager.class).isIgnoringBatteryOptimizations(getPackageName());
                  boolean running = Util.wantRunning(this);

                  accessBtn.setText(access ? "✓ อนุญาตเข้าถึงการแจ้งเตือนแล้ว" : "1. อนุญาตเข้าถึงการแจ้งเตือน (จำเป็น)");
                  accessBtn.setTextColor(access ? ACCENT : FG);
                  batteryBtn.setText(battery ? "✓ ไม่จำกัดแบตเตอรี่แล้ว" : "2. ปิดการจำกัดแบตเตอรี่ (แนะนำ)");
                  batteryBtn.setTextColor(battery ? ACCENT : FG);
                  toggleBtn.setText(running ? "หยุดรีโมท" : "3. เริ่มรีโมท");

                  String url = Util.url(this);
                  if (!running) {
                      statusText.setText("หยุดอยู่");
                      qr.setImageBitmap(null);
                      urlText.setText("");
                      hintText.setText("ทำตามขั้นที่ 1–3 แล้วสแกน QR ด้วยกล้อง iPhone");
                  } else if (url == null) {
                      statusText.setText("ยังไม่ได้ต่อ Wi-Fi");
                      qr.setImageBitmap(null);
                      urlText.setText("");
                      hintText.setText("ต่อ Wi-Fi วงเดียวกับ iPhone");
                      handler.postDelayed(this::refresh, 3000);
                  } else {
                      statusText.setText("กำลังทำงาน");
                      qr.setImageBitmap(qrBitmap(url));
                      urlText.setText(url);
                      hintText.setText("สแกน QR ด้วยกล้อง iPhone แล้วเปิดใน Safari\n"
                              + "จากนั้นกดแชร์ → เพิ่มไปยังหน้าจอโฮม\n"
                              + "ปิดหน้าจอ R4 ได้ รีโมทยังทำงานอยู่");
                  }
              }

              private static Bitmap qrBitmap(String s) {
                  try {
                      int size = 480;
                      BitMatrix m = new QRCodeWriter().encode(s, BarcodeFormat.QR_CODE, size, size);
                      int[] px = new int[size * size];
                      for (int y = 0; y < size; y++)
                          for (int x = 0; x < size; x++)
                              px[y * size + x] = m.get(x, y) ? Color.BLACK : Color.WHITE;
                      return Bitmap.createBitmap(px, size, size, Bitmap.Config.RGB_565);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private Button button(android.view.View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(8);
                  b.setLayoutParams(lp);
                  return b;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
