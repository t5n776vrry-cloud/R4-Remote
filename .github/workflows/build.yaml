                  batteryBtn.setText(battery ? "✓ ไม่จำกัดแบตเตอรี่แล้ว" : "2. ปิดการจำกัดแบตเตอรี่ (แนะนำ)");
                  batteryBtn.setTextColor(battery ? ACCENT : FG);
                  toggleBtn.setText(running ? "หยุดรีโมท" : "3. เริ่มรีโมท");

                  String url = Util.url(this);
                  if (!running) {
                      statusText.setText("หยุดอยู่");
                      qr.setImageBitmap(null);
                      urlText.setText("");
                      hintText.setText("ทำตามขั้นที่ 1–3 แล้วสแกน QR ด้วยกล้อง iPhone");
                  } else if (url == null) {
                      statusText.setText("ยังไม่ได้ต่อ Wi-Fi");
                      qr.setImageBitmap(null);
                      urlText.setText("");
                      hintText.setText("ต่อ Wi-Fi วงเดียวกับ iPhone");
                      handler.postDelayed(this::refresh, 3000);
                  } else {
                      statusText.setText("กำลังทำงาน");
                      qr.setImageBitmap(qrBitmap(url));
                      urlText.setText(url);
                      hintText.setText("สแกน QR ด้วยกล้อง iPhone แล้วเปิดใน Safari\n"
                              + "จากนั้นกดแชร์ → เพิ่มไปยังหน้าจอโฮม\n"
                              + "ปิดหน้าจอ R4 ได้ รีโมทยังทำงานอยู่");
                  }
              }

              private static Bitmap qrBitmap(String s) {
                  try {
                      int size = 480;
                      BitMatrix m = new QRCodeWriter().encode(s, BarcodeFormat.QR_CODE, size, size);
                      int[] px = new int[size * size];
                      for (int y = 0; y < size; y++)
                          for (int x = 0; x < size; x++)
                              px[y * size + x] = m.get(x, y) ? Color.BLACK : Color.WHITE;
                      return Bitmap.createBitmap(px, size, size, Bitmap.Config.RGB_565);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  return t;
              }

              private Button button(android.view.View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(8);
                  b.setLayoutParams(lp);
                  return b;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
          R4EOF

      - name: Build APK
        working-directory: src
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../R4Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: R4Remote-apk
          path: R4Remote.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: R4Remote
          files: R4Remote.apk
          make_latest: true
